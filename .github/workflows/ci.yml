name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 17 is the baseline; 21 exercises the virtual-thread executor.
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # The reranker integration test downloads a ~90 MB model, pinned by revision.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ragkit/models
          key: ragkit-models-ms-marco-MiniLM-L6-v2-233902d2
      # Docker is available on ubuntu-latest, so the Testcontainers integration tests run here.
      - run: mvn -B verify
